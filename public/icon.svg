<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7d2fe"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#312e81" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>

  <!-- subtle backdrop grid -->
  <g opacity="0.14" stroke="#ffffff" stroke-width="1">
    <path d="M2 30h96M2 52h96M2 74h96" />
    <path d="M30 2v96M52 2v96M74 2v96" />
  </g>

  <!-- form sheet -->
  <g filter="url(#soft)">
    <rect x="24" y="16" width="46" height="62" rx="7" fill="#ffffff"/>
    <rect x="31" y="26" width="26" height="4.5" rx="2.25" fill="#c7d2fe"/>
    <rect x="31" y="35" width="32" height="4.5" rx="2.25" fill="#e0e7ff"/>
    <rect x="31" y="44" width="18" height="4.5" rx="2.25" fill="#e0e7ff"/>

    <!-- answer field -->
    <rect x="31" y="55" width="32" height="10" rx="3" fill="#eef2ff"/>
    <rect x="31" y="55" width="20" height="10" rx="3" fill="#818cf8" opacity="0.5"/>
    <rect x="31" y="69" width="24" height="4.5" rx="2.25" fill="#e0e7ff"/>
  </g>

  <!-- check badge -->
  <g filter="url(#soft)">
    <circle cx="68" cy="66" r="15" fill="#ffffff"/>
    <path d="M61.5 66.5l4.5 4.5 9-9" fill="none" stroke="#6366f1" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- sparkles -->
  <circle cx="17" cy="22" r="2.2" fill="#ffffff" opacity="0.5"/>
  <circle cx="86" cy="18" r="1.6" fill="#ffffff" opacity="0.4"/>
  <circle cx="14" cy="82" r="1.6" fill="#ffffff" opacity="0.35"/>
</svg>
